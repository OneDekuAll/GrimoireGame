<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GrimoireGame{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IM Fell English', serif;
            background: linear-gradient(135deg, {{ theme.bg_primary }}, {{ theme.bg_secondary }});
            min-height: 100vh;
            color: white;
        }

        /* Navigation Bar */
        .navbar {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid {{ theme.primary }};
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: {{ theme.primary }};
            text-decoration: none;
            font-weight: bold;
        }

        .navbar-menu {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            color: {{ theme.accent }};
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: {{ theme.primary }};
        }

        .logout-btn {
            background: linear-gradient(135deg, {{ theme.danger }}, #8b0000);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 20, 60, 0.5);
        }

        .user-info {
            color: {{ theme.secondary }};
            font-size: 0.9rem;
            margin-right: 1rem;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px {{ theme.primary }}, 0 0 30px {{ theme.primary }};
            }
            50% {
                text-shadow: 0 0 30px {{ theme.accent }}, 0 0 40px {{ theme.accent }};
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, {{ theme.secondary }}, {{ theme.primary }});
            color: #000;
            border: 2px solid {{ theme.primary }};
            padding: 1rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-green {
            background: linear-gradient(135deg, #2d5016, #50c878);
        }

        /* Page transitions */
        .page-transition {
            animation: fadeIn 0.5s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .navbar-menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .user-info {
                display: none;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>

    <script>
        function transitionToPage(url) {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.3s';
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                transitionToPage('/logout');
            }
        }
    </script>
</head>
<body class="page-transition">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">✨ GrimoreGame ✨</a>
        
        <div class="navbar-menu">
            {% if user %}
                <span class="user-info">👤 {{ user.username }}</span>
                <a href="/" class="nav-link">🏠 Home</a>
                <a href="/library" class="nav-link">📚 Library</a>
                <a href="/quest-grimoire" class="nav-link">📖 Quests</a>
                <a href="/settings" class="nav-link">⚙️ Settings</a>
                <button onclick="logout()" class="logout-btn">🚪 Logout</button>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <script>
        // Fade in on load
        document.addEventListener('DOMContentLoaded', function() {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
